apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: auroravalidations.aurora.sh
spec:
  group: aurora.sh
  names:
    kind: AuroraValidation
    plural: auroravalidations
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              manifest:
                type: object
              policies:
                type: array
                items:
                  type: string
              webhookUrl:
                type: string
          status:
            type: object
            properties:
              validationId:
                type: string
              status:
                type: string
              violations:
                type: array
              lastValidated:
                type: string
