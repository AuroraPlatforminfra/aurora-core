apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: aurora
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
    - job_name: 'aurora-core'
      static_configs:
      - targets: ['aurora-core:8001']
      scrape_interval: 5s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: aurora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: storage
          mountPath: /prometheus
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: aurora
spec:
  type: ClusterIP
  ports:
  - port: 9090
  selector:
    app: prometheus
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: aurora
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: aurora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:latest
        ports:
        - containerPort: 6831
          protocol: UDP
        - containerPort: 16686
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-agent
  namespace: aurora
spec:
  type: ClusterIP
  ports:
  - port: 6831
    protocol: UDP
  selector:
    app: jaeger
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-ui
  namespace: aurora
spec:
  type: NodePort
  ports:
  - port: 16686
    nodePort: 30686
  selector:
    app: jaeger
